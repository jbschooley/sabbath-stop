<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Sabbath Stop">
  <!-- Home-screen variant: full-bleed green, border concentric with the iOS corner mask -->
  <!-- Highway exit panel: green board, white inset border, meetinghouse, arrowhead -->
  <rect x="0" y="0" width="512" height="512" fill="#1f7a4d"/>
  <rect x="58" y="58" width="396" height="396" rx="96" fill="none" stroke="#ffffff" stroke-width="14"/>
  <!-- Meetinghouse, centred vertically on the panel (y 132..380) -->
  <g fill="#ffffff" transform="translate(3,0)">
    <!-- spire -->
    <polygon points="196,132 209,200 183,200"/>
    <!-- tower, seated into the roof -->
    <rect x="182" y="196" width="28" height="70"/>
    <!-- roof -->
    <polygon points="100,294 292,294 196,244"/>
    <!-- body -->
    <rect x="112" y="290" width="168" height="90"/>
    <!-- eave line -->
    <rect x="100" y="290" width="192" height="10"/>
    <!-- door cut in green -->
    <rect x="184" y="334" width="24" height="50" fill="#1f7a4d"/>
  </g>
  <!-- exit-sign arrowhead: a filled delta with a notched back, pointing right -->
  <!-- equal 38px gaps: border-chapel, chapel-chevron, chevron-border -->
  <polygon points="338,196 404,256 338,316 358,256" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
</svg>
